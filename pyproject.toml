[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fem-surrogate"
version = "1.0.0"
description = "ML surrogate model for FEM traction-plate simulations"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0,<3",
    "pyarrow>=14.0",
    "numpy>=1.26,<2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
dashboard = [
    "streamlit>=1.33",
    "plotly>=5.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — enforced by line-length above
    "E741",   # ambiguous variable names (l, O, I) — used in physics formulas
    "W291",   # trailing whitespace
    "W293",   # whitespace before comment
    "F841",   # local variable assigned but never used (some catch-all excepts)
]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "src/simulations/",
    "src/processing/spark_ingest.py",
    "src/dashboard/app.py",
]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
