name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: |
          pip install mypy types-PyYAML types-requests
          mypy src/ \
            --ignore-missing-imports \
            --exclude "src/simulations" \
            --exclude "src/processing/spark_ingest.py" \
            --exclude "src/dashboard/app.py"

      - name: Lint (py_compile)
        run: |
          python -m py_compile \
            src/config.py \
            src/registry.py \
            src/evaluation.py \
            src/cli.py \
            src/api/main.py \
            src/api/schemas.py \
            src/api/model_loader.py \
            src/utils/manifest.py \
            src/utils/integrity.py \
            src/utils/s3_client.py \
            src/simulations/traction_plate_with_hole.py \
            src/simulations/traction_plate_without_hole.py \
            src/simulations/traction_plate_moving_hole.py \
            src/processing/validate.py \
            src/processing/build_features.py \
            src/training/train_advanced.py

      - name: Run tests with coverage
        # FEM simulations require FEniCS/Docker — excluded from CI.
        # test_smoke.py uses synthetic proxy data only (no FEniCS).
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v

      - name: Notify Slack — success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *CI passed* — `${{ github.repository }}` · branch `${{ github.ref_name }}` · pushed by *${{ github.actor }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *CI failed* — `${{ github.repository }}` · branch `${{ github.ref_name }}` · pushed by *${{ github.actor }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
