# FEM Surrogate ML Platform — Full Stack
#
# Services
# --------
#   minio       S3-compatible object store (raw data + MLflow artifacts)
#   minio-setup One-shot bucket initialisation (exits after setup)
#   postgres    PostgreSQL — MLflow tracking backend
#   mlflow      MLflow tracking server (UI on :5000)
#   api         FastAPI model-serving layer (on :8000)
#   dashboard   Streamlit user-facing UI (on :8501)
#   prometheus  Metrics scraping (on :9090)
#   grafana     Observability dashboards (on :3000)
#
# Usage
# -----
#   cp .env.example .env          # fill in real secrets
#   docker compose up -d          # start everything
#   docker compose logs -f api    # tail API logs
#   docker compose down -v        # tear down (removes volumes!)

networks:
  fem-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

# ── Shared default restart policy ─────────────────────────────────────────────
x-restart: &default-restart
  restart: unless-stopped

# ── MinIO ─────────────────────────────────────────────────────────────────────
services:
  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:                ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD:            ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION:                   ${MINIO_REGION:-us-east-1}
      MINIO_PROMETHEUS_AUTH_TYPE:     public
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - ./data/minio-storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks: [fem-net]

  # One-shot: Spark ETL — reads raw-simulations, writes processed-simulations
  # Run manually: docker compose --profile etl up spark-etl
  spark-etl:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["etl"]
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID:      ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY:  ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_RAW:       ${MINIO_BUCKET_RAW:-raw-simulations}
      MINIO_BUCKET_PROCESSED: ${MINIO_BUCKET_PROCESSED:-processed-simulations}
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    networks: [fem-net]
    restart: "no"

  # One-shot: create all required buckets then exit
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET_RAW:-raw-simulations};
        mc mb --ignore-existing local/${MINIO_BUCKET_PROCESSED:-processed-simulations};
        mc mb --ignore-existing local/${MINIO_BUCKET_FEATURES:-features};
        mc mb --ignore-existing local/${MINIO_BUCKET_ARTIFACTS:-ml-artifacts};
        echo 'Buckets ready.';
      "
    networks: [fem-net]

# ── PostgreSQL (MLflow backend store) ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mlflow}
      POSTGRES_USER:     ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow_secret}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [fem-net]

# ── MLflow tracking server ─────────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    command: >
      mlflow server
        --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow_secret}@postgres:5432/${POSTGRES_DB:-mlflow}
        --default-artifact-root s3://${MINIO_BUCKET_ARTIFACTS:-ml-artifacts}/
        --host 0.0.0.0
        --port 5000
    environment:
      # S3/MinIO credentials for artifact storage
      MLFLOW_S3_ENDPOINT_URL:   http://minio:9000
      AWS_ACCESS_KEY_ID:        ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY:    ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION:       ${MINIO_REGION:-us-east-1}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks: [fem-net]

# ── FastAPI model-serving API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      REGISTRY_DIR:          /app/artifacts/models
      MODEL_NAME:            ${MODEL_NAME:-lgbm_surrogate}
      MLFLOW_TRACKING_URI:   http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-fem-surrogate}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID:     ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION:    ${MINIO_REGION:-us-east-1}
      API_LOG_LEVEL:         ${API_LOG_LEVEL:-INFO}
      API_USERNAME:          ${API_USERNAME:-admin}
      API_PASSWORD:          ${API_PASSWORD:-mdp123}
    volumes:
      # Mount the host artifacts directory so the API can read trained models
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fem-net]

# ── Streamlit dashboard ───────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    <<: *default-restart
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks: [fem-net]

# ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    <<: *default-restart
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks: [fem-net]

# ── Grafana ────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    <<: *default-restart
    environment:
      GF_SECURITY_ADMIN_USER:       ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:   ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL:           http://localhost:3000
      GF_AUTH_ANONYMOUS_ENABLED:    "false"
      GF_UNIFIED_ALERTING_ENABLED:  "true"
      GF_ALERTING_ENABLED:          "false"
      SLACK_WEBHOOK_URL:            ${SLACK_WEBHOOK_URL:-}
      SLACK_CHANNEL:                ${SLACK_CHANNEL:-#fem-surrogate-platform}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [fem-net]
