# Default LightGBM hyperparameters used when n_trials=0 (Optuna disabled).
# These values are used as-is without any cross-validation search.
# To override, set DEFAULT_PARAMS_PATH env var to point to another YAML file.
n_estimators: 1000
learning_rate: 0.05
num_leaves: 127
max_depth: 10
min_child_samples: 20
subsample: 0.8
colsample_bytree: 0.8
reg_alpha: 0.1
reg_lambda: 1.0
