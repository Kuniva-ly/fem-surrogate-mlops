global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: fem-surrogate

alerting:
  alertmanagers: []

scrape_configs:

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # FastAPI application metrics (prometheus-fastapi-instrumentator)
  - job_name: fem_api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # MLflow server (basic up-check; MLflow does not expose prom metrics natively)
  - job_name: mlflow
    metrics_path: /health
    static_configs:
      - targets: [mlflow:5000]
    # MLflow /health returns 200 OK text, not Prometheus format — use blackbox probe if needed

  # MinIO metrics (exposed at /minio/v2/metrics/cluster by default)
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
