global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: fem-surrogate

# Alerting est géré par Grafana Unified Alerting — pas d'Alertmanager nécessaire.

scrape_configs:

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # FastAPI application metrics (prometheus-fastapi-instrumentator)
  - job_name: fem_api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # MLflow — /health retourne HTTP 200, suffit pour le metric up{job="mlflow"}
  - job_name: mlflow
    metrics_path: /health
    static_configs:
      - targets: [mlflow:5000]

  # MinIO cluster metrics — auth désactivée via MINIO_PROMETHEUS_AUTH_TYPE=public
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
